name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust tooling
        run: >-
          rustup toolchain install stable --profile minimal
          --component clippy,rustfmt --target wasm32-wasip1
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run checks
        run: ./scripts/check

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.88
        run: >-
          rustup toolchain install 1.88 --profile minimal
          --target wasm32-wasip1
      - name: Test native workspace
        run: cargo +1.88 test --workspace --locked
      - name: Check Zellij plugin
        run: >-
          cargo +1.88 check --package niri-zvim-zellij
          --target wasm32-wasip1 --locked
