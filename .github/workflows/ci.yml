name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust tooling
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy,rustfmt --target wasm32-wasip1
      - name: Select Rust 1.97.1
        run: rustup override set 1.97.1
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run checks
        run: ./scripts/check
