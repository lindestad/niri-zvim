[workspace]
members = ["crates/core", "crates/niri-zvim", "crates/zellij-plugin"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/lindestad/niri-zvim"
homepage = "https://github.com/lindestad/niri-zvim"

[workspace.dependencies]
anyhow = "1.0.100"
niri-ipc = "26.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zellij-tile = "=0.44.3"

[profile.release]
lto = "thin"
strip = true

[profile.release.package.niri-zvim-zellij]
opt-level = "s"
